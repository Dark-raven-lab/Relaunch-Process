# Автоматический релиз: версия задаётся в Properties/AssemblyInfo.cs.
# При push в master workflow читает AssemblyInformationalVersion. Если тега v<версия> ещё нет,
# собирает x64 Release, создаёт тег на этом коммите и публикует zip в GitHub Releases.
# Если тег уже есть (версию не поднимали), сборка пропускается.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          function Get-Attr($name) {
            $m = [regex]::Match($text, "(?m)^\[assembly:\s*$name\(""([^""]+)""\)\]")
            if (-not $m.Success) { throw "$name not found in Properties/AssemblyInfo.cs" }
            $m.Groups[1].Value
          }
          $ver = Get-Attr 'AssemblyInformationalVersion'
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "AssemblyInformationalVersion '$ver' must look like 1.2.3" }
          foreach ($name in 'AssemblyVersion', 'AssemblyFileVersion') {
            $value = Get-Attr $name
            if (-not $value.StartsWith("$ver.")) { throw "$name '$value' does not match AssemblyInformationalVersion '$ver'" }
          }
          $tag = "v$ver"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { Write-Host "Tag $tag already exists, nothing to release." }
          else { Write-Host "Releasing $tag." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$(-not $exists)".ToLower() >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v2
        if: steps.version.outputs.release == 'true'

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: msbuild "Process Auto Relaunch.csproj" -restore -p:Configuration=Release -p:Platform=x64 -p:PostBuildEvent= -verbosity:minimal

      - name: Package
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem bin/x64/Release/* -File -Exclude *.pdb
          if (-not ($files | Where-Object Name -eq 'Relaunch Process.exe')) { throw 'Relaunch Process.exe not found in bin/x64/Release' }
          $files | Compress-Archive -DestinationPath "Relaunch-Process-${{ steps.version.outputs.tag }}-x64.zip"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$env:TAG" "Relaunch-Process-$env:TAG-x64.zip" --target "${{ github.sha }}" --title "$env:TAG" --generate-notes
